<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport khusus AR agar layar tidak bisa di-zoom secara tidak sengaja oleh anak-anak -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamera AR - Belajar Hardware</title>
    
    <!-- Memanggil Library A-Frame dan AR.js langsung dari CDN -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Memanggil file script logika AR (ar-handler.js) yang mendeteksi status marker -->
    <script src="assets/js/ar-handler.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* Menghilangkan scrollbar karena AR mengambil seluruh layar */
        body { margin: 0; overflow: hidden; font-family: 'Poppins', sans-serif; }
        
        /* Desain tombol kembali (Overlay di atas kamera) */
        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
        }
        
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #1E293B;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
        }
        
        .btn-back:hover {
            background: #3B82F6;
            color: white;
            border-color: #3B82F6;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.3);
        }

        /* Desain kotak instruksi di bawah layar */
        .instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 999;
            pointer-events: none;
        }

        .instructions p {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: inline-block;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            color: #1E293B;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        /* Kontrol Zoom Khusus Desktop/Manual */
        .zoom-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 999;
        }

        .btn-zoom {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #1E293B;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-zoom:hover {
            background: #3B82F6;
            color: white;
            border-color: #3B82F6;
            transform: scale(1.1);
        }

        /* Responsive UI untuk Tablet dan HP */
        @media (max-width: 768px) {
            .zoom-controls {
                right: 15px;
                gap: 10px;
            }
            .btn-zoom {
                width: 45px;
                height: 45px;
                font-size: 22px;
            }
        }
        /* =========================================
           LOADING SCREEN
           ========================================= */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- LAYAR LOADING (Akan hilang otomatis saat 3D selesai didownload) -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Mempersiapkan 3D & Kamera (Mohon Tunggu)...</div>
    </div>

    <!-- Antarmuka UI (Tombol dan Instruksi) -->
    <div class="ui-container">
        <a href="index.html" class="btn-back" style="margin-bottom: 15px;"><i class="ph ph-arrow-left"></i> Kembali</a>
        <br>
        <button id="btn-mirror" class="btn-back" style="background: rgba(59, 130, 246, 0.9); color: white; border: none; padding: 10px 15px; display: inline-flex; cursor: pointer;">
            <i class="ph ph-arrows-left-right"></i> Flip Kamera
        </button>
    </div>

    <div class="instructions">
        <p>Arahkan kamera ke Marker untuk melihat 3D!</p>
    </div>

    <!-- Tombol Zoom (Terlihat di Desktop & Mobile) -->
    <div class="zoom-controls">
        <button id="btn-zoom-in" class="btn-zoom">+</button>
        <button id="btn-zoom-out" class="btn-zoom">-</button>
    </div>

    <!-- Mulai Lingkungan 3D & AR -->
    <!-- Menghapus resolusi hardcode agar kamera menyesuaikan rasio asli HP (mencegah crop) -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; videoTexture: true;"
        renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
        vr-mode-ui="enabled: false"> <!-- Menyembunyikan tombol kacamata VR bawaan -->

        <!-- 1. Tempat Mendaftarkan Aset 3D -->
        <a-assets>
            <a-asset-item id="model-1" src="assets/models/1cpu.glb"></a-asset-item>
            <a-asset-item id="model-2" src="assets/models/2gpu.glb"></a-asset-item>
            <a-asset-item id="model-3" src="assets/models/3mouse.glb"></a-asset-item>
            <a-asset-item id="model-4" src="assets/models/4keyboard.glb"></a-asset-item>
            <a-asset-item id="model-5" src="assets/models/5motherboard.glb"></a-asset-item>
            <a-asset-item id="model-6" src="assets/models/6ram.glb"></a-asset-item>
            <a-asset-item id="model-7" src="assets/models/7webcam.glb"></a-asset-item>
            <a-asset-item id="model-8" src="assets/models/8monitor.glb"></a-asset-item>
            <a-asset-item id="model-9" src="assets/models/9speaker.glb"></a-asset-item>
            <a-asset-item id="model-10" src="assets/models/10ssd_kit.glb"></a-asset-item>
        </a-assets>

        <!-- 2. Pengaturan Marker -->
        <!-- Marker 1: CPU -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-1cpu.patt" marker-handler>
            <a-entity gltf-model="#model-1" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Prosesor (CPU)" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- Marker 2: GPU -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-2gpu.patt" marker-handler>
            <a-entity gltf-model="#model-2" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Kartu Grafis (GPU)" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- Marker 3: Mouse -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-3mouse.patt" marker-handler>
            <a-entity gltf-model="#model-3" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Mouse" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- Marker 4: Keyboard -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-4keyboard.patt" marker-handler>
            <a-entity gltf-model="#model-4" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Keyboard" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- Marker 5: Motherboard -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-5motherboard.patt" marker-handler>
            <a-entity gltf-model="#model-5" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Motherboard" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- Marker 6: RAM -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-6ram.patt" marker-handler>
            <a-entity gltf-model="#model-6" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Memori (RAM)" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- Marker 7: Webcam -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-7webcam.patt" marker-handler>
            <a-entity gltf-model="#model-7" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Webcam" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- Marker 8: Monitor -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-8monitor.patt" marker-handler>
            <a-entity gltf-model="#model-8" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Monitor" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- Marker 9: Speaker -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-9speaker.patt" marker-handler>
            <a-entity gltf-model="#model-9" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Speaker" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- Marker 10: SSD -->
        <a-marker type="pattern" url="assets/markers/patt/pattern-10ssd.patt" marker-handler>
            <a-entity gltf-model="#model-10" scale="0.5 0.5 0.5" position="0 0 0"></a-entity>
            <a-text value="Penyimpanan (SSD)" align="center" position="0 0.1 1.5" rotation="-90 0 0" color="#2B3674"></a-text>
        </a-marker>

        <!-- 3. Kamera Virtual pembaca AR -->
        <a-entity camera></a-entity>

    </a-scene>

    <!-- Script Menghilangkan Loading Screen & Fitur Mirror -->
    <script>
        // Logika Loading Screen
        document.querySelector('a-scene').addEventListener('loaded', function () {
            const loadingScreen = document.getElementById('loading-screen');
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.visibility = 'hidden';
                }, 500); 
            }, 500);
        });

        // Logika Tombol Flip (Mirror) Kamera
        const btnMirror = document.getElementById('btn-mirror');
        let isMirrored = false;

        btnMirror.addEventListener('click', () => {
            isMirrored = !isMirrored;
            const video = document.querySelector('video');
            const canvas = document.querySelector('.a-canvas');
            
            if (video && canvas) {
                if (isMirrored) {
                    video.style.transform = 'scaleX(-1)';
                    canvas.style.transform = 'scaleX(-1)';
                    btnMirror.style.background = '#10B981'; // Hijau tanda aktif
                } else {
                    video.style.transform = 'scaleX(1)';
                    canvas.style.transform = 'scaleX(1)';
                    btnMirror.style.background = 'rgba(59, 130, 246, 0.9)'; // Kembali biru
                }
            }
        });
    </script>
    <!-- Menghubungkan ke script dark mode -->
    <script src="assets/js/theme-toggle.js"></script>
</body>
</html>
